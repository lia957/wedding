<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>웨딩 손익분기점 계산기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --toss-blue: #3182F6;
      --toss-blue-dark: #1B64DA;
      --toss-green: #00C48C;
      --toss-red: #F04452;
      --gray-50: #F9FAFB;
      --gray-100: #F2F4F6;
      --gray-200: #E5E8EB;
      --gray-500: #8B95A1;
      --gray-700: #4E5968;
      --gray-900: #191F28;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      padding: 24px 20px 40px;
      color: var(--gray-900);
    }
    .container {
      max-width: 400px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--gray-900);
    }
    .subtitle {
      font-size: 0.875rem;
      color: var(--gray-500);
      margin-bottom: 28px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group:last-child {
      margin-bottom: 0;
    }
    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 1rem;
      font-family: inherit;
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      background: #fff;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--toss-blue);
      box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
    }
    input::placeholder {
      color: var(--gray-500);
    }
    .input-suffix {
      position: relative;
    }
    .input-suffix input {
      padding-right: 52px;
    }
    .input-suffix .suffix {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.875rem;
      color: var(--gray-500);
      pointer-events: none;
    }
    .btn {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: var(--toss-blue);
      color: #fff;
      margin-top: 24px;
    }
    .btn-primary:hover {
      background: var(--toss-blue-dark);
    }
    .result-section {
      display: none;
      margin-top: 20px;
    }
    .result-section.visible {
      display: block;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--gray-100);
      font-size: 0.9375rem;
    }
    .result-row:last-of-type {
      border-bottom: none;
    }
    .result-label {
      color: var(--gray-700);
      font-weight: 500;
    }
    .result-value {
      font-weight: 700;
      color: var(--gray-900);
    }
    .result-value.expense {
      color: var(--toss-red);
    }
    .result-value.income {
      color: var(--toss-blue);
    }
    .result-breakdown {
      padding: 10px 0;
      font-size: 0.875rem;
    }
    .result-total {
      border-top: 1px solid var(--gray-200);
      margin-top: 4px;
      padding-top: 14px;
      font-weight: 600;
    }
    .fun-message {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      text-align: center;
    }
    .fun-message.surplus {
      background: rgba(0, 196, 140, 0.12);
      color: #009A6E;
    }
    .fun-message.deficit {
      background: rgba(240, 68, 82, 0.1);
      color: var(--toss-red);
    }
    .fun-message.break-even {
      background: rgba(49, 130, 246, 0.12);
      color: var(--toss-blue);
    }
    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 48px;
      margin-top: 16px;
      background: var(--gray-100);
      color: var(--gray-900);
      border: none;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }
    .share-btn:hover {
      background: var(--gray-200);
    }
    .share-btn svg {
      width: 20px;
      height: 20px;
    }
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--gray-900);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.875rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      z-index: 100;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    .banner-wrap {
      width: 100%;
      height: 96px;
      margin-top: 16px;
    }
    .sim-block {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--gray-100);
    }
    .sim-title {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 16px;
      text-align: center;
    }
    .sim-guest-big {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--gray-900);
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .sim-guest-big span {
      font-size: 1rem;
      font-weight: 600;
      color: var(--gray-500);
      margin-left: 4px;
    }
    .sim-slider-wrap {
      margin-top: 8px;
    }
    .sim-slider-wrap input[type="range"] {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: var(--gray-200);
      border-radius: 3px;
      outline: none;
    }
    .sim-slider-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--toss-blue);
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(49, 130, 246, 0.3);
    }
    .sim-slider-wrap input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--toss-blue);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 4px rgba(49, 130, 246, 0.3);
    }
    .slider-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.75rem;
      color: var(--gray-500);
    }
    .sim-hint {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.45;
      text-align: center;
    }
    .sim-hint.deficit {
      background: rgba(240, 68, 82, 0.1);
      color: var(--toss-red);
    }
    .sim-hint.surplus {
      background: rgba(0, 196, 140, 0.12);
      color: #009A6E;
    }
    .sim-hint.hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>웨딩 손익분기점 계산기</h1>
    <p class="subtitle">💍 우리 결혼식 남을까 모자랄까?</p>

    <div class="card">
      <div class="input-group">
        <label for="hallRental">웨딩홀 대관료</label>
        <div class="input-suffix">
          <input type="number" id="hallRental" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="mealPerPerson">1인당 식대</label>
        <div class="input-suffix">
          <input type="number" id="mealPerPerson" placeholder="0" min="0" inputmode="numeric" step="0.5" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="sdme">스드메</label>
        <div class="input-suffix">
          <input type="number" id="sdme" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="groomSuit">신랑 예복</label>
        <div class="input-suffix">
          <input type="number" id="groomSuit" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="parentSuit">혼주 한복/예복</label>
        <div class="input-suffix">
          <input type="number" id="parentSuit" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="snapDvd">본식 스냅/DVD</label>
        <div class="input-suffix">
          <input type="number" id="snapDvd" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="invitation">청첩장</label>
        <div class="input-suffix">
          <input type="number" id="invitation" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="thankYouGift">답례품</label>
        <div class="input-suffix">
          <input type="number" id="thankYouGift" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
      <div class="input-group">
        <label for="etc">기타</label>
        <div class="input-suffix">
          <input type="number" id="etc" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">만원</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="input-group">
        <label for="guests">예상 하객 수</label>
        <div class="input-suffix">
          <input type="number" id="guests" placeholder="0" min="0" inputmode="numeric" />
          <span class="suffix">명</span>
        </div>
      </div>
      <div class="input-group">
        <label for="avgGift">평균 축의금</label>
        <div class="input-suffix">
          <input type="number" id="avgGift" placeholder="0" min="0" inputmode="numeric" step="0.5" />
          <span class="suffix">만원</span>
        </div>
      </div>
    </div>

    <button type="button" class="btn btn-primary" id="calcBtn">손익 계산하기</button>

    <div class="result-section" id="resultSection">
      <div class="card result-card">
        <div class="result-row">
          <span class="result-label">총 웨딩 비용</span>
          <span class="result-value expense" id="totalCost">0만원</span>
        </div>
        <div class="result-row">
          <span class="result-label">예상 축의금 수입</span>
          <span class="result-value income" id="totalIncome">0만원</span>
        </div>

        <div class="sim-block">
          <p class="sim-title">하객수를 조정해보세요! 👇</p>
          <div class="sim-guest-big" id="simGuestBig">0<span>명</span></div>
          <div class="sim-slider-wrap">
            <input type="range" id="simGuestSlider" min="0" max="500" value="0" step="5" />
            <div class="slider-labels"><span>0명</span><span>500명</span></div>
          </div>
          <div class="sim-hint deficit hidden" id="simHintDeficit"></div>
          <div class="sim-hint surplus hidden" id="simHintSurplus"></div>
        </div>
      </div>

      <div class="banner-wrap" id="bannerWrap"></div>

      <button type="button" class="share-btn" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
        공유하기
      </button>
    </div>
  </div>

  <div class="toast" id="toast">링크가 복사됐어요!</div>

  <script>
    (function() {
      var hallRental = document.getElementById('hallRental');
      var mealPerPerson = document.getElementById('mealPerPerson');
      var sdme = document.getElementById('sdme');
      var snapDvd = document.getElementById('snapDvd');
      var groomSuit = document.getElementById('groomSuit');
      var parentSuit = document.getElementById('parentSuit');
      var invitation = document.getElementById('invitation');
      var thankYouGift = document.getElementById('thankYouGift');
      var etc = document.getElementById('etc');
      var guests = document.getElementById('guests');
      var avgGift = document.getElementById('avgGift');
      var calcBtn = document.getElementById('calcBtn');
      var resultSection = document.getElementById('resultSection');
      var simGuestSlider = document.getElementById('simGuestSlider');
      var simGuestBig = document.getElementById('simGuestBig');
      var simHintDeficit = document.getElementById('simHintDeficit');
      var simHintSurplus = document.getElementById('simHintSurplus');
      var totalCostEl = document.getElementById('totalCost');
      var totalIncomeEl = document.getElementById('totalIncome');
      var shareBtn = document.getElementById('shareBtn');
      var toast = document.getElementById('toast');

      function num(v) {
        var n = parseFloat(String(v).replace(/[^0-9.-]/g, '')) || 0;
        return n < 0 ? 0 : n;
      }

      function formatWon(value) {
        return (value % 1 === 0 ? value : value.toFixed(1)) + '만원';
      }

      function getFunMessage(totalCost, totalIncome, guestsCount, avgGiftPerPerson) {
        var diff = totalIncome - totalCost;
        var ratio = totalCost > 0 ? (totalIncome / totalCost) * 100 : 100;

        if (diff >= 0 && ratio <= 101) {
          return {
            text: '거의 본전! 🎯 축의금으로 웨딩 비용을 거의 다 채웠어요.',
            type: 'break-even'
          };
        }
        if (diff > 0) {
          return {
            text: '흑자 결혼식 💚 축의금이 비용보다 ' + formatWon(diff) + ' 많아요!',
            type: 'surplus'
          };
        }
        var needMore = Math.ceil(-diff / (avgGiftPerPerson || 1));
        var pct = Math.round(ratio);
        if (pct >= 70) {
          return {
            text: '자급자족률 ' + pct + '% 🔥 하객 ' + needMore + '명만 더 오면 흑자!',
            type: 'deficit'
          };
        }
        if (pct >= 50) {
          return {
            text: '자급자족률 ' + pct + '% ✨ 하객 ' + needMore + '명 더 오면 본전이에요.',
            type: 'deficit'
          };
        }
        return {
          text: '자급자족률 ' + pct + '% 💪 하객 ' + needMore + '명만 더 부르면 갚을 수 있어요!',
          type: 'deficit'
        };
      }

      function showToast(msg) {
        toast.textContent = msg || '링크가 복사됐어요!';
        toast.classList.add('show');
        setTimeout(function() {
          toast.classList.remove('show');
        }, 2000);
      }

      var GUESTS_MAX = 500;

      function snapGuestToSliderStep(g) {
        g = Math.min(GUESTS_MAX, Math.max(0, Math.round(g)));
        return Math.round(g / 5) * 5;
      }

      function computeForGuests(guestCount) {
        var avg = num(avgGift.value);
        var mealPer = num(mealPerPerson.value);
        var costs = {
          hallRental: num(hallRental.value),
          mealTotal: mealPer * guestCount,
          sdme: num(sdme.value),
          snapDvd: num(snapDvd.value),
          groomSuit: num(groomSuit.value),
          parentSuit: num(parentSuit.value),
          invitation: num(invitation.value),
          thankYouGift: num(thankYouGift.value),
          etc: num(etc.value)
        };
        var totalCost = costs.hallRental + costs.mealTotal + costs.sdme + costs.snapDvd +
          costs.groomSuit + costs.parentSuit + costs.invitation + costs.thankYouGift + costs.etc;
        var totalIncome = guestCount * avg;
        return { totalCost: totalCost, totalIncome: totalIncome, avg: avg, mealPer: mealPer };
      }

      function updateSimHints(guestCount, totalCost, totalIncome, avg, mealPer) {
        var diff = totalIncome - totalCost;
        simHintDeficit.classList.add('hidden');
        simHintSurplus.classList.add('hidden');
        if (diff < 0) {
          var shortfall = totalCost - totalIncome;
          var netPerGuest = avg - mealPer;
          var needMore;
          if (netPerGuest > 0) {
            needMore = Math.ceil(shortfall / netPerGuest);
          } else if (avg > 0) {
            needMore = Math.ceil(shortfall / avg);
          } else {
            simHintDeficit.textContent = '평균 축의금을 입력하면 하객 추가 시 필요 인원을 계산할 수 있어요.';
            simHintDeficit.classList.remove('hidden');
            return;
          }
          simHintDeficit.textContent = '흑자 되려면 하객 ' + needMore + '명 더 필요해요';
          simHintDeficit.classList.remove('hidden');
        } else if (diff > 0) {
          simHintSurplus.textContent = '지금 하객수면 ' + formatWon(diff) + ' 남아요 🎉';
          simHintSurplus.classList.remove('hidden');
        }
      }

      function updateResultsFromSimulator() {
        var guestCount = parseInt(simGuestSlider.value, 10) || 0;
        simGuestBig.innerHTML = guestCount + '<span>명</span>';
        var r = computeForGuests(guestCount);
        totalCostEl.textContent = formatWon(r.totalCost);
        totalCostEl.className = 'result-value expense';
        totalIncomeEl.textContent = formatWon(r.totalIncome);
        totalIncomeEl.className = 'result-value income';
        updateSimHints(guestCount, r.totalCost, r.totalIncome, r.avg, r.mealPer);
        return r;
      }

      function runCalc() {
        var fromInput = Math.min(GUESTS_MAX, Math.max(0, Math.round(num(guests.value))));
        var snapped = snapGuestToSliderStep(fromInput);
        simGuestSlider.value = snapped;
        resultSection.classList.add('visible');
        var r = updateResultsFromSimulator();
        var shareMsg = r.totalIncome >= r.totalCost
          ? '지금 하객수면 ' + formatWon(r.totalIncome - r.totalCost) + ' 남아요 🎉'
          : '흑자 되려면 하객을 더 부르면 돼요';
        return {
          totalCost: r.totalCost,
          totalIncome: r.totalIncome,
          message: shareMsg
        };
      }

      simGuestSlider.addEventListener('input', function() {
        if (resultSection.classList.contains('visible')) {
          updateResultsFromSimulator();
        }
      });

      calcBtn.addEventListener('click', function() {
        runCalc();
      });

      var shareUrl = 'https://lia957.github.io/wedding/';

      shareBtn.addEventListener('click', function() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(shareUrl).then(function() {
            showToast('링크가 복사됐어요!');
          }).catch(fallbackCopyUrl);
        } else {
          fallbackCopyUrl();
        }
      });

      function fallbackCopyUrl() {
        var ta = document.createElement('textarea');
        ta.value = shareUrl;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast('링크가 복사됐어요!');
        } catch (e) {}
        document.body.removeChild(ta);
      }
    })();
  </script>
  <script>
    // 배너 광고 초기화
    // 테스트 ID: ait.v2.live.5e6efd731b12486c
    // 실제 ID: ait.v2.live.5e6efd731b12486c (출시 시 교체)
    var AD_GROUP_ID = 'ait.v2.live.5e6efd731b12486c';

    if (window.TossAds && window.TossAds.initialize.isSupported()) {
      window.TossAds.initialize({
        callbacks: {
          onInitialized: function() {
            if (window.TossAds.attachBanner.isSupported()) {
              window.TossAds.attachBanner(
                AD_GROUP_ID,
                document.getElementById('bannerWrap'),
                {
                  theme: 'auto',
                  tone: 'grey',
                  variant: 'expanded',
                }
              );
            }
          },
          onInitializationFailed: function(error) {
            console.error('배너 광고 초기화 실패:', error);
          },
        },
      });
    }
  </script>
</body>
</html>
